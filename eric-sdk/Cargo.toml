[package]
name = "eric-sdk"
version = "0.6.0"
authors.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Rust SDK for the ELSTER Rich Client (ERiC)"
documentation = "https://docs.rs/eric-sdk"
keywords = ["eric", "sdk",  "taxes", "accounting"]
categories = ["finance"]
include = [
  "src/**",
  "LICENSE",
  "CHANGELOG.md",
]

[lib]
path = "src/lib.rs"
name = "eric_sdk"

[package.metadata.docs.rs]
features = ["no-linking"]
environment = { ERIC_VERSION = "43.4.6.0" }

[features]
default = []
# This feature is used to run external tests that connect to the Elster servers.
external-test = []
# Generate FFI bindings at build time via bindgen (requires libclang).
# Use this on platforms without pre-generated bindings.
generate-bindings = ["eric-bindings/generate-bindings"]
# Skip linking against libericapi.so. Used in CI unit tests and for docs.rs publishing.
no-linking = ["eric-bindings/no-linking"]

[dependencies]
eric-bindings = { version = "0.5.0", path = "../eric-bindings" }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
roxmltree = "0.20.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
