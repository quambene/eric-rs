[package]
name = "eric-sdk"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Rust SDK for the ELSTER Rich Client (ERiC)"
documentation = "https://docs.rs/eric-sdk"
keywords = ["eric", "sdk",  "taxes", "accounting"]
categories = ["finance"]
include = [
  "src/**",
  "LICENSE",
  "CHANGELOG.md",
]

[lib]
path = "src/lib.rs"
name = "eric_sdk"

[package.metadata.docs.rs]
features = ["docs-rs"]

[features]
default = []
external-test = []
# Generate FFI bindings at build time via bindgen (requires libclang).
# Use this on platforms without pre-generated bindings (e.g. macOS aarch64).
generate-bindings = ["eric-bindings/generate-bindings"]
# This feature is used in CI pipeline for unit tests.
no-linking = ["eric-bindings/no-linking"]
# This feature is used to publish the documentation for `eric-sdk`.
docs-rs = ["eric-bindings/docs-rs"]

[dependencies]
eric-bindings = { version = "0.5.0", path = "../eric-bindings" }
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
roxmltree = "0.20.0"
