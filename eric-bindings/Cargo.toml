[package]
name = "eric-bindings"
version = "0.6.2"
authors.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Rust bindings for the ELSTER Rich Client (ERiC)"
documentation = "https://docs.rs/eric-bindings"
keywords = ["eric", "bindings",  "taxes", "accounting"]
categories = ["external-ffi-bindings"]
build = "build.rs"
include = [
  "src/**",
  "bindings/**",
  "build.rs",
  "LICENSE",
  "CHANGELOG.md",
]

[lib]
path = "src/lib.rs"
name = "eric_bindings"

[package.metadata.docs.rs]
features = ["no-linking"]

[features]
default = []
generate-bindings = ["dep:bindgen"]
# Opt-in: include comments from the C header in generated bindings.
# Default off so generated output matches the committed bundled shape.
bindgen-comments = []
# Skip linking against libericapi.so. Used in CI unit tests and for docs.rs publishing.
no-linking = []

[dependencies]
anyhow = { workspace = true }

[build-dependencies]
bindgen = { version = "0.69.4", optional = true }
