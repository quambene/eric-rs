name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
  ERIC_VERSION: 44.2.4.0
  ERIC_PATH: ERiC-44.2.4.0-Linux-x86_64/ERiC-44.2.4.0/Linux-x86_64
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check --all-targets
  check-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.79.0
      - name: cargo check (MSRV)
        run: cargo check --all-targets
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo doc
        run: cargo doc --no-deps
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt --check
        run: cargo fmt --check
  fmt-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: cargo +nightly fmt --check
        run: cargo +nightly fmt --check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --lib
        run: cargo test --lib -p eric-sdk --features no-linking
  doc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --doc
        run: cargo test --locked --doc -p eric-sdk
  # This job ensures that the eric-bindings crate can be packaged successfully.
  package-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo package -p eric-bindings
        run: cargo package -p eric-bindings --features no-linking
      # - name: cargo package -p eric-sdk
      #   run: cargo package -p eric-sdk --features no-linking
  # This job ensures that the committed bindings do not include `#[doc = ...]` attributes.
  bindings-no-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no `#[doc = ...]` in committed bindings
        run: |
          if grep -RnE '^\s*#\[doc = ' eric-bindings/bindings/; then
            echo "::error::Committed bindings include #[doc = ...] attributes."
            echo "Regenerate with --features generate-bindings (without bindgen-comments)."
            exit 1
          fi
